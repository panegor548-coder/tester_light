name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter>=5.2.0 pyserial>=3.5 pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))" > ctk_path.txt
        set /p CTK_PATH=<ctk_path.txt
        pyinstaller --noconfirm --onedir --windowed --add-data "%CTK_PATH%;customtkinter/" app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FPV-Stand-Controller-Windows
        path: dist/app/
