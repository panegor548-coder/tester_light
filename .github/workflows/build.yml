name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter>=5.2.0 pyserial>=3.5 pyinstaller

    - name: Build Single EXE with PyInstaller
      run: |
        python -c "import customtkinter, os, PyInstaller.__main__; ctk_dir = os.path.dirname(customtkinter.__file__); PyInstaller.__main__.run(['app.py', '--noconfirm', '--onefile', '--windowed', f'--add-data={ctk_dir};customtkinter/'])"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tester_lightEXE
        path: dist/app.exe
